# Example Kamal config. Copy to config/deploy.yml (git-ignored) and fill in your own host and domain.
service: forma-system1-experiment
image: forma-system1-experiment

servers:
  web:
    hosts:
      - 203.0.113.10

proxy:
  host: forma.example.com
  app_port: 8080
  ssl: true
  buffering:
    responses: false        # Luna's text is streamed to the page as it is written
  healthcheck:
    path: /up

volumes:
  - forma-experiment-data:/data   # usage counters survive deploys

env:
  clear:
    DAILY_USD_CAP: 5          # new model calls stop for the day once this much is spent (Jev + Luna)
  secret:
    - STATS_TOKEN            # enables the private GET /api/stats report
    - TYPESAFE_API_KEY       # Jev by TypeSafe AI; without it the server falls back to a labelled mock
    - OPENAI_API_KEY         # Luna (gpt-5.6-luna) writes the words; without it the pre-written copy is used

registry:
  server: ghcr.io
  username: your-user
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
